name: CI - Java

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # The conformance harness reads testkit/compliance-tests/fixtures, which the
      # full checkout provides; Fixtures.dir() walks up from java/ to find it.
      - run: cd java && mvn -B test
