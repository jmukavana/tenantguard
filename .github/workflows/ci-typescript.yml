name: CI - TypeScript

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: cd typescript && npm ci
      - run: cd typescript && npm run typecheck
      # The conformance harness reads testkit/compliance-tests/fixtures, which the full
      # checkout provides; fixturesDir() walks up from typescript/ to find it.
      - run: cd typescript && npm test
